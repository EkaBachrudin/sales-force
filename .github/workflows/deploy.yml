name: Build and Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_FE: sales-force-frontend
  IMAGE_BE: sales-force-backend

jobs:
  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    environment: SALES_SERVER
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Frontend
        id: meta-fe
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_FE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for Backend
        id: meta-be
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_BE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./sales-force-fe
          push: true
          tags: ${{ steps.meta-fe.outputs.tags }}
          labels: ${{ steps.meta-fe.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./sales-force-be
          push: true
          tags: ${{ steps.meta-be.outputs.tags }}
          labels: ${{ steps.meta-be.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

      - name: Generate deployment summary
        run: |
          echo "### Deployed Images :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | \`${{ steps.meta-fe.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`${{ steps.meta-be.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: SALES_SERVER
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || 22 }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose file to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          port: ${{ env.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.registry.yml"
          target: "/var/www/sales-force"
          strip_components: 1

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          port: ${{ env.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            # Set variables
            DEPLOY_DIR="/var/www/sales-force"
            REGISTRY_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            REGISTRY="ghcr.io/$REGISTRY_OWNER"
            FE_TAG="${{ github.ref_name }}"
            BE_TAG="${{ github.ref_name }}"

            echo "=== Starting deployment ==="
            echo "Frontend: $REGISTRY/${{ env.IMAGE_FE }}:$FE_TAG"
            echo "Backend: $REGISTRY/${{ env.IMAGE_BE }}:$BE_TAG"

            # Create deploy directory if not exists
            sudo mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR

            # Login to GitHub Container Registry
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            echo "Pulling images..."
            docker pull $REGISTRY/${{ env.IMAGE_FE }}:$FE_TAG
            docker pull $REGISTRY/${{ env.IMAGE_BE }}:$FE_TAG

            # Tag as latest
            docker tag $REGISTRY/${{ env.IMAGE_FE }}:$FE_TAG $REGISTRY/${{ env.IMAGE_FE }}:latest
            docker tag $REGISTRY/${{ env.IMAGE_BE }}:$FE_TAG $REGISTRY/${{ env.IMAGE_BE }}:latest

            # Run docker compose with registry images
            echo "Starting services..."
            sudo docker compose -f docker-compose.registry.yml --env-file .env pull
            sudo docker compose -f docker-compose.registry.yml --env-file .env up -d

            # Wait for services to be healthy
            echo "Waiting for services to be ready..."
            sleep 10

            # Show running containers
            sudo docker compose -f docker-compose.registry.yml --env-file .env ps

            # Cleanup old images
            echo "Cleaning up old images..."
            docker image prune -af --filter "until=24h"

            echo "=== Deployment completed ==="
