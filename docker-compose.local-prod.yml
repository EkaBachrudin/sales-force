# Local Production Override Configuration
# Gunakan: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.local-prod.yml up -d

version: '3.9'

services:
  # ========================================
  # NGINX - Local Production (HTTP only, no SSL)
  # ========================================
  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/local-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_cache:/var/cache/nginx
      - ./docker/logs/nginx:/var/log/nginx
