# ============================================
# Production Docker Compose - Using Registry Images
# ============================================
# File ini digunakan di VPS untuk pull image dari container registry
# Penggunaan: docker compose -f docker-compose.registry.yml --env-file .env up -d

services:
  # ========================================
  # FRONTEND (Next.js) - From Registry
  # ========================================
  frontend:
    image: ${REGISTRY:-ghcr.io/ekabachrudin}/sales-force-frontend:${IMAGE_TAG:-latest}
    container_name: sales-force-fe
    restart: unless-stopped
    networks:
      - sales-force-network
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # BACKEND (NestJS) - From Registry
  # ========================================
  backend:
    image: ${REGISTRY:-ghcr.io/ekabachrudin}/sales-force-backend:${IMAGE_TAG:-latest}
    container_name: sales-force-be
    restart: unless-stopped
    networks:
      - sales-force-network
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # DATABASE (PostgreSQL) - Official Image
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: sales-force-db
    restart: unless-stopped
    networks:
      - sales-force-network
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # NGINX (Reverse Proxy)
  # ========================================
  nginx:
    image: nginx:alpine
    container_name: sales-force-nginx
    restart: unless-stopped
    networks:
      - sales-force-network
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx_cache:/var/cache/nginx
      - ./docker/logs/nginx:/var/log/nginx
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  nginx_cache:
    driver: local

networks:
  sales-force-network:
    driver: bridge
